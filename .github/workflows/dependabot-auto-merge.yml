---
name: Dependabot auto-merge

# Release PRs touch exactly these two files and nothing else. Excluding them
# stops this workflow being queued for a pull request opened by a bot, which
# GitHub holds for manual approval and then reports as a failed check - on
# every release, for a job that would have been skipped anyway.
on:
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json

permissions: {}

jobs:
  dependabot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
