version: 2

release:
  mode: keep-existing

builds:
  - main: .
    binary: claude-statusline
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

checksum:
  name_template: checksums.txt

changelog:
  disable: true
