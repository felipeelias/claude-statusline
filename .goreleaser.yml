version: 2

release:
  mode: keep-existing

builds:
  - main: .
    binary: claude-statusline
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

homebrew_casks:
  - name: claude-statusline
    repository:
      owner: felipeelias
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/felipeelias/claude-statusline
    description: Configurable status line for Claude Code
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/claude-statusline"]
          end

checksum:
  name_template: checksums.txt

changelog:
  disable: true
