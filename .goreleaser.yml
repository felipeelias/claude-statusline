version: 2

release:
  mode: keep-existing

builds:
  - main: .
    binary: claude-statusline
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

brews:
  - name: claude-statusline
    directory: Formula
    repository:
      owner: frank-bee
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/frank-bee/claude-statusline
    description: Configurable status line for Claude Code
    license: MIT

checksum:
  name_template: checksums.txt

changelog:
  disable: true
